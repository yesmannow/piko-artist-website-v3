<!-- Placeholder Vinyl Texture for 3D Jog Wheels -->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background (Black vinyl) -->
  <circle cx="256" cy="256" r="256" fill="#0a0a0a"/>

  <!-- Vinyl grooves (concentric circles) -->
  <g stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.5">
    <circle cx="256" cy="256" r="240"/>
    <circle cx="256" cy="256" r="225"/>
    <circle cx="256" cy="256" r="210"/>
    <circle cx="256" cy="256" r="195"/>
    <circle cx="256" cy="256" r="180"/>
    <circle cx="256" cy="256" r="165"/>
    <circle cx="256" cy="256" r="150"/>
    <circle cx="256" cy="256" r="135"/>
    <circle cx="256" cy="256" r="120"/>
  </g>

  <!-- Center label area (glossy) -->
  <circle cx="256" cy="256" r="100" fill="#1a1a1a"/>
  <circle cx="256" cy="256" r="95" fill="url(#labelGradient)" opacity="0.8"/>

  <!-- Center hole -->
  <circle cx="256" cy="256" r="15" fill="#000000"/>

  <!-- Gradient definition for label -->
  <defs>
    <radialGradient id="labelGradient">
      <stop offset="0%" style="stop-color:#2a2a2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Vinyl shine (top-left reflection) -->
  <ellipse cx="180" cy="180" rx="120" ry="80" fill="white" opacity="0.05"
           transform="rotate(-45 180 180)"/>
</svg>
