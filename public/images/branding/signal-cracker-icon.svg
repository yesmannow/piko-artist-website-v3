<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Signal Cracker Icon - Boxed Crosshair Brutalist Design -->

  <!-- Outer Box -->
  <rect x="4" y="4" width="56" height="56"
        fill="none"
        stroke="#E0E0E0"
        stroke-width="3" />

  <!-- Inner Crosshair -->
  <!-- Horizontal Line -->
  <line x1="8" y1="32" x2="28" y2="32"
        stroke="#FFD700"
        stroke-width="2"
        stroke-linecap="square" />
  <line x1="36" y1="32" x2="56" y2="32"
        stroke="#FFD700"
        stroke-width="2"
        stroke-linecap="square" />

  <!-- Vertical Line -->
  <line x1="32" y1="8" x2="32" y2="28"
        stroke="#FFD700"
        stroke-width="2"
        stroke-linecap="square" />
  <line x1="32" y1="36" x2="32" y2="56"
        stroke="#FFD700"
        stroke-width="2"
        stroke-linecap="square" />

  <!-- Center Dot -->
  <circle cx="32" cy="32" r="3" fill="#FFD700" />

  <!-- Corner Brackets -->
  <path d="M 4 4 L 12 4 L 12 12 L 4 12 Z"
        fill="none"
        stroke="#E0E0E0"
        stroke-width="2" />
  <path d="M 60 4 L 52 4 L 52 12 L 60 12 Z"
        fill="none"
        stroke="#E0E0E0"
        stroke-width="2" />
  <path d="M 4 60 L 12 60 L 12 52 L 4 52 Z"
        fill="none"
        stroke="#E0E0E0"
        stroke-width="2" />
  <path d="M 60 60 L 52 60 L 52 52 L 60 52 Z"
        fill="none"
        stroke="#E0E0E0"
        stroke-width="2" />
</svg>

